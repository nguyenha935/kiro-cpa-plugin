name: Kiro plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Scan tracked files for secrets
        shell: pwsh
        run: |
          $patterns = @(
            '(?i)(refresh[_-]?token|client[_-]?secret|access[_-]?token)\s*[=:]\s*["'']?[A-Za-z0-9_./+=-]{40,}',
            'Atzr\|[A-Za-z0-9_./+=-]{30,}',
            'AQoDYXdzEJr[A-Za-z0-9_./+=-]{20,}'
          )
          $trackedFiles = git ls-files | Where-Object { $_ -ne 'go.sum' -and (Test-Path -LiteralPath $_) }
          $findings = foreach ($file in $trackedFiles) {
            Select-String -LiteralPath $file -Pattern $patterns
          }
          if ($findings) {
            $findings | ForEach-Object { "{0}:{1}" -f $_.Path, $_.LineNumber }
            throw 'Potential secret found in tracked files.'
          }

  # Build jobs upload straight into a draft release instead of going through
  # actions/upload-artifact, so the account's artifact storage quota never
  # blocks a release. The draft is published only after every target uploaded.
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Kiro plugin $GITHUB_REF_NAME" \
              --generate-notes
          fi

  windows-amd64:
    needs: [test, prepare-release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.prepare-release.result != 'failure' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '1'
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          go build -trimpath -buildmode=c-shared `
            -ldflags "-X github.com/nguyenha935/kiro-cpa-plugin/internal/auth/kiro.clientVersion=2.19.0 -X main.pluginVersion=$version" `
            -o package/kiro-ha.dll ./cmd/kiro-plugin
          $hash = (Get-FileHash -Algorithm SHA256 package/kiro-ha.dll).Hash.ToLowerInvariant()
          "$hash  kiro-ha.dll" | Set-Content -NoNewline -Encoding ascii package/kiro-ha.dll.sha256
          Compress-Archive -Path package/* -DestinationPath kiro-ha-windows-amd64.zip
          $archiveHash = (Get-FileHash -Algorithm SHA256 kiro-ha-windows-amd64.zip).Hash.ToLowerInvariant()
          "$archiveHash  kiro-ha-windows-amd64.zip" | Set-Content -NoNewline -Encoding ascii kiro-ha-windows-amd64.zip.sha256
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME kiro-ha-windows-amd64.zip kiro-ha-windows-amd64.zip.sha256 --repo $env:GITHUB_REPOSITORY --clobber

  linux:
    needs: [test, prepare-release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.prepare-release.result != 'failure' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: gcc
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ARM64 cross compiler
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p package
          version="dev-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          go build -trimpath -buildmode=c-shared \
            -ldflags "-X github.com/nguyenha935/kiro-cpa-plugin/internal/auth/kiro.clientVersion=2.19.0 -X main.pluginVersion=$version" \
            -o package/kiro-ha.so ./cmd/kiro-plugin
          strings package/kiro-ha.so | grep -Fq "$version"
          nm -D package/kiro-ha.so | grep -Fq 'cliproxy_plugin_init'
          sha256sum package/kiro-ha.so | sed 's#package/##' > package/kiro-ha.so.sha256
          tar -C package -czf "kiro-ha-linux-${GOARCH}.tar.gz" kiro-ha.so kiro-ha.h kiro-ha.so.sha256
          sha256sum "kiro-ha-linux-${GOARCH}.tar.gz" > "kiro-ha-linux-${GOARCH}.tar.gz.sha256"
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "kiro-ha-linux-${{ matrix.arch }}.tar.gz" "kiro-ha-linux-${{ matrix.arch }}.tar.gz.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-amd64, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
