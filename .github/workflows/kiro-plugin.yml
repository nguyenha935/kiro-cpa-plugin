name: Kiro plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and release (leave empty for a dev build of the selected ref)
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Scan tracked files for secrets
        shell: pwsh
        run: |
          $patterns = @(
            '(?i)(refresh[_-]?token|client[_-]?secret|access[_-]?token)\s*[=:]\s*["'']?[A-Za-z0-9_./+=-]{40,}',
            'Atzr\|[A-Za-z0-9_./+=-]{30,}',
            'AQoDYXdzEJr[A-Za-z0-9_./+=-]{20,}'
          )
          $trackedFiles = git ls-files | Where-Object { $_ -ne 'go.sum' -and (Test-Path -LiteralPath $_) }
          $findings = foreach ($file in $trackedFiles) {
            Select-String -LiteralPath $file -Pattern $patterns
          }
          if ($findings) {
            $findings | ForEach-Object { "{0}:{1}" -f $_.Path, $_.LineNumber }
            throw 'Potential secret found in tracked files.'
          }

  # Release assets go straight to a draft GitHub release instead of through
  # actions/upload-artifact, so the account's artifact storage quota can never
  # block a release. The draft is published only after every target uploaded.
  # A tag push releases that tag; workflow_dispatch with `tag` releases an
  # existing tag without moving it.
  prepare-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=""
          if [[ -n "$INPUT_TAG" ]]; then tag="$INPUT_TAG"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -n "$tag" && "$tag" != v* ]]; then echo "tag must start with v: $tag" >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        if: steps.resolve.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Kiro plugin $TAG" \
              --generate-notes
          fi

  windows-amd64:
    needs: prepare-release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '1'
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.TrimStart('v') } else { "dev-$((git rev-parse HEAD).Substring(0,7))" }
          go build -trimpath -buildmode=c-shared `
            -ldflags "-X github.com/nguyenha935/kiro-cpa-plugin/internal/auth/kiro.clientVersion=2.19.0 -X main.pluginVersion=$version" `
            -o package/kiro-ha.dll ./cmd/kiro-plugin
          # The linker drops an -X that names a missing symbol without an error.
          # Both defaults ("dev") differ from the stamped values, so a missing
          # string means the stamp never applied.
          $stamped = [System.IO.File]::ReadAllText('package/kiro-ha.dll', [System.Text.Encoding]::ASCII)
          foreach ($needle in @($version, '2.19.0')) {
            if (-not $stamped.Contains($needle)) { throw "kiro-ha.dll is missing stamped version $needle" }
          }
          $hash = (Get-FileHash -Algorithm SHA256 package/kiro-ha.dll).Hash.ToLowerInvariant()
          "$hash  kiro-ha.dll" | Set-Content -NoNewline -Encoding ascii package/kiro-ha.dll.sha256
          Compress-Archive -Path package/* -DestinationPath kiro-ha-windows-amd64.zip
          $archiveHash = (Get-FileHash -Algorithm SHA256 kiro-ha-windows-amd64.zip).Hash.ToLowerInvariant()
          "$archiveHash  kiro-ha-windows-amd64.zip" | Set-Content -NoNewline -Encoding ascii kiro-ha-windows-amd64.zip.sha256
          # The plugin store looks for one exact asset name per platform and
          # reads nothing but zip, so a release also carries that name. The
          # archive above keeps its own name for manual installs.
          if ($env:RELEASE_TAG) {
            $storeZip = "kiro-ha_${version}_windows_amd64.zip"
            Compress-Archive -Path package/* -DestinationPath $storeZip
            $storeHash = (Get-FileHash -Algorithm SHA256 $storeZip).Hash.ToLowerInvariant()
            "$storeHash  $storeZip" | Set-Content -Encoding ascii "$storeZip.sha256"
          }
      - name: Upload release assets
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          gh release upload $env:RELEASE_TAG `
            kiro-ha-windows-amd64.zip kiro-ha-windows-amd64.zip.sha256 `
            "kiro-ha_${version}_windows_amd64.zip" "kiro-ha_${version}_windows_amd64.zip.sha256" `
            --repo $env:GITHUB_REPOSITORY --clobber

  linux:
    needs: prepare-release
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: gcc
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ARM64 cross compiler
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p package
          version="dev-$(git rev-parse --short=7 HEAD)"
          if [[ -n "$RELEASE_TAG" ]]; then version="${RELEASE_TAG#v}"; fi
          go build -trimpath -buildmode=c-shared \
            -ldflags "-X github.com/nguyenha935/kiro-cpa-plugin/internal/auth/kiro.clientVersion=2.19.0 -X main.pluginVersion=$version" \
            -o package/kiro-ha.so ./cmd/kiro-plugin
          strings package/kiro-ha.so | grep -Fq "$version"
          # The linker drops an -X that names a missing symbol without an error.
          # This catches it because the source default is "dev", not 2.19.0, so
          # the string is only present when the stamp actually applied.
          strings package/kiro-ha.so | grep -Fq '2.19.0'
          nm -D package/kiro-ha.so | grep -Fq 'cliproxy_plugin_init'
          sha256sum package/kiro-ha.so | sed 's#package/##' > package/kiro-ha.so.sha256
          tar -C package -czf "kiro-ha-linux-${GOARCH}.tar.gz" kiro-ha.so kiro-ha.h kiro-ha.so.sha256
          sha256sum "kiro-ha-linux-${GOARCH}.tar.gz" > "kiro-ha-linux-${GOARCH}.tar.gz.sha256"
          # The plugin store looks for one exact asset name per platform and
          # reads nothing but zip, so a release also carries that name. The
          # tarball keeps its own name for manual installs.
          if [[ -n "$RELEASE_TAG" ]]; then
            store_zip="kiro-ha_${version}_linux_${GOARCH}.zip"
            zip -j -q "$store_zip" package/kiro-ha.so package/kiro-ha.h package/kiro-ha.so.sha256
            sha256sum "$store_zip" > "$store_zip.sha256"
          fi
      - name: Upload release assets
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GOARCH: ${{ matrix.arch }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "kiro-ha-linux-${GOARCH}.tar.gz" \
            "kiro-ha-linux-${GOARCH}.tar.gz.sha256" \
            "kiro-ha_${version}_linux_${GOARCH}.zip" \
            "kiro-ha_${version}_linux_${GOARCH}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # macos-latest is an arm64 runner; clang builds the amd64 library from the
  # same host with -arch x86_64, so both store archives come from one image.
  darwin:
    needs: prepare-release
    strategy:
      matrix:
        include:
          - arch: arm64
            clang_arch: arm64
          - arch: amd64
            clang_arch: x86_64
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build package
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
          CC: clang -arch ${{ matrix.clang_arch }}
          CLANG_ARCH: ${{ matrix.clang_arch }}
        run: |
          mkdir -p package
          version="dev-$(git rev-parse --short=7 HEAD)"
          if [[ -n "$RELEASE_TAG" ]]; then version="${RELEASE_TAG#v}"; fi
          go build -trimpath -buildmode=c-shared \
            -ldflags "-X github.com/nguyenha935/kiro-cpa-plugin/internal/auth/kiro.clientVersion=2.19.0 -X main.pluginVersion=$version" \
            -o package/kiro-ha.dylib ./cmd/kiro-plugin
          # The linker drops an -X that names a missing symbol without an error;
          # both source defaults are "dev", so the strings prove the stamps.
          grep -aFq "$version" package/kiro-ha.dylib
          grep -aFq '2.19.0' package/kiro-ha.dylib
          nm -gU package/kiro-ha.dylib | grep -Fq 'cliproxy_plugin_init'
          [[ "$(lipo -archs package/kiro-ha.dylib)" == "$CLANG_ARCH" ]]
          (cd package && shasum -a 256 kiro-ha.dylib > kiro-ha.dylib.sha256)
          tar -C package -czf "kiro-ha-darwin-${GOARCH}.tar.gz" kiro-ha.dylib kiro-ha.h kiro-ha.dylib.sha256
          shasum -a 256 "kiro-ha-darwin-${GOARCH}.tar.gz" > "kiro-ha-darwin-${GOARCH}.tar.gz.sha256"
          if [[ -n "$RELEASE_TAG" ]]; then
            store_zip="kiro-ha_${version}_darwin_${GOARCH}.zip"
            zip -j -q "$store_zip" package/kiro-ha.dylib package/kiro-ha.h package/kiro-ha.dylib.sha256
            shasum -a 256 "$store_zip" > "$store_zip.sha256"
          fi
      - name: Upload release assets
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GOARCH: ${{ matrix.arch }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "kiro-ha-darwin-${GOARCH}.tar.gz" \
            "kiro-ha-darwin-${GOARCH}.tar.gz.sha256" \
            "kiro-ha_${version}_darwin_${GOARCH}.zip" \
            "kiro-ha_${version}_darwin_${GOARCH}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  release:
    if: needs.prepare-release.outputs.tag != ''
    needs: [prepare-release, windows-amd64, linux, darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The store verifies an archive against a single checksums.txt covering
      # every platform, so it can only be written once all targets uploaded.
      - name: Publish checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir sums --pattern 'kiro-ha_*.zip.sha256'
          # awk terminates every record it prints, so a file written without a
          # trailing newline cannot merge two entries into one unreadable line,
          # and a CRLF file cannot leave a stray return in the asset name.
          awk '{ sub(/\r$/, ""); if (NF) print }' sums/*.sha256 > checksums.txt
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64; do
            archive="kiro-ha_${version}_${target}.zip"
            grep -q " ${archive}\$" checksums.txt || { echo "checksums.txt is missing $archive" >&2; exit 1; }
          done
          gh release upload "$TAG" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
