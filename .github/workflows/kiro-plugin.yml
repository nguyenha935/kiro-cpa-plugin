name: Kiro plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Scan tracked files for secrets
        shell: pwsh
        run: |
          $patterns = @(
            '(?i)(refresh[_-]?token|client[_-]?secret|access[_-]?token)\s*[=:]\s*["'']?[A-Za-z0-9_./+=-]{40,}',
            'Atzr\|[A-Za-z0-9_./+=-]{30,}',
            'AQoDYXdzEJr[A-Za-z0-9_./+=-]{20,}'
          )
          $trackedFiles = git ls-files | Where-Object { $_ -ne 'go.sum' -and (Test-Path -LiteralPath $_) }
          $findings = foreach ($file in $trackedFiles) {
            Select-String -LiteralPath $file -Pattern $patterns
          }
          if ($findings) {
            $findings | ForEach-Object { "{0}:{1}" -f $_.Path, $_.LineNumber }
            throw 'Potential secret found in tracked files.'
          }

  windows-amd64:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '1'
          go build -trimpath -buildmode=c-shared `
            -ldflags "-X github.com/JPSAUD501/CLIProxyAPI-Kiro-Plugin/internal/auth/kiro.clientVersion=2.19.0" `
            -o package/kiro.dll ./cmd/kiro-plugin
          $hash = (Get-FileHash -Algorithm SHA256 package/kiro.dll).Hash.ToLowerInvariant()
          "$hash  kiro.dll" | Set-Content -NoNewline -Encoding ascii package/kiro.dll.sha256
          Compress-Archive -Path package/* -DestinationPath kiro-windows-amd64.zip
          $archiveHash = (Get-FileHash -Algorithm SHA256 kiro-windows-amd64.zip).Hash.ToLowerInvariant()
          "$archiveHash  kiro-windows-amd64.zip" | Set-Content -NoNewline -Encoding ascii kiro-windows-amd64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: kiro-windows-amd64
          path: |
            kiro-windows-amd64.zip
            kiro-windows-amd64.zip.sha256
          if-no-files-found: error

  linux:
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: gcc
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ARM64 cross compiler
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p package
          go build -trimpath -buildmode=c-shared \
            -ldflags "-X github.com/JPSAUD501/CLIProxyAPI-Kiro-Plugin/internal/auth/kiro.clientVersion=2.19.0" \
            -o package/kiro.so ./cmd/kiro-plugin
          sha256sum package/kiro.so | sed 's#package/##' > package/kiro.so.sha256
          tar -C package -czf "kiro-linux-${GOARCH}.tar.gz" kiro.so kiro.h kiro.so.sha256
          sha256sum "kiro-linux-${GOARCH}.tar.gz" > "kiro-linux-${GOARCH}.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: kiro-linux-${{ matrix.arch }}
          path: |
            kiro-linux-${{ matrix.arch }}.tar.gz
            kiro-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-amd64, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: kiro-*
          path: dist
          merge-multiple: true
      - name: Publish plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Kiro plugin $GITHUB_REF_NAME" \
            --generate-notes
