name: Kiro plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and release (leave empty for a dev build of the selected ref)
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Scan tracked files for secrets
        shell: pwsh
        run: |
          $patterns = @(
            '(?i)(refresh[_-]?token|client[_-]?secret|access[_-]?token)\s*[=:]\s*["'']?[A-Za-z0-9_./+=-]{40,}',
            'Atzr\|[A-Za-z0-9_./+=-]{30,}',
            'AQoDYXdzEJr[A-Za-z0-9_./+=-]{20,}'
          )
          $trackedFiles = git ls-files | Where-Object { $_ -ne 'go.sum' -and (Test-Path -LiteralPath $_) }
          $findings = foreach ($file in $trackedFiles) {
            Select-String -LiteralPath $file -Pattern $patterns
          }
          if ($findings) {
            $findings | ForEach-Object { "{0}:{1}" -f $_.Path, $_.LineNumber }
            throw 'Potential secret found in tracked files.'
          }

  # Release assets go straight to a draft GitHub release instead of through
  # actions/upload-artifact, so the account's artifact storage quota can never
  # block a release. The draft is published only after every target uploaded.
  # A tag push releases that tag; workflow_dispatch with `tag` releases an
  # existing tag without moving it.
  prepare-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=""
          if [[ -n "$INPUT_TAG" ]]; then tag="$INPUT_TAG"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -n "$tag" && "$tag" != v* ]]; then echo "tag must start with v: $tag" >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        if: steps.resolve.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Kiro plugin $TAG" \
              --generate-notes
          fi

  windows-amd64:
    needs: prepare-release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '1'
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.TrimStart('v') } else { "dev-$((git rev-parse HEAD).Substring(0,7))" }
          go build -trimpath -buildmode=c-shared `
            -ldflags "-X github.com/nguyenha935/kiro-cpa-plugin/internal/auth/kiro.clientVersion=2.19.0 -X main.pluginVersion=$version" `
            -o package/kiro-ha.dll ./cmd/kiro-plugin
          # The linker drops an -X that names a missing symbol without an error,
          # so assert both stamped versions are really in the binary.
          $stamped = [System.IO.File]::ReadAllText('package/kiro-ha.dll', [System.Text.Encoding]::ASCII)
          foreach ($needle in @($version, '2.19.0')) {
            if (-not $stamped.Contains($needle)) { throw "kiro-ha.dll is missing stamped version $needle" }
          }
          $hash = (Get-FileHash -Algorithm SHA256 package/kiro-ha.dll).Hash.ToLowerInvariant()
          "$hash  kiro-ha.dll" | Set-Content -NoNewline -Encoding ascii package/kiro-ha.dll.sha256
          Compress-Archive -Path package/* -DestinationPath kiro-ha-windows-amd64.zip
          $archiveHash = (Get-FileHash -Algorithm SHA256 kiro-ha-windows-amd64.zip).Hash.ToLowerInvariant()
          "$archiveHash  kiro-ha-windows-amd64.zip" | Set-Content -NoNewline -Encoding ascii kiro-ha-windows-amd64.zip.sha256
      - name: Upload release assets
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:RELEASE_TAG kiro-ha-windows-amd64.zip kiro-ha-windows-amd64.zip.sha256 --repo $env:GITHUB_REPOSITORY --clobber

  linux:
    needs: prepare-release
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: gcc
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ARM64 cross compiler
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p package
          version="dev-$(git rev-parse --short=7 HEAD)"
          if [[ -n "$RELEASE_TAG" ]]; then version="${RELEASE_TAG#v}"; fi
          go build -trimpath -buildmode=c-shared \
            -ldflags "-X github.com/nguyenha935/kiro-cpa-plugin/internal/auth/kiro.clientVersion=2.19.0 -X main.pluginVersion=$version" \
            -o package/kiro-ha.so ./cmd/kiro-plugin
          strings package/kiro-ha.so | grep -Fq "$version"
          # The linker drops an -X that names a missing symbol without an error,
          # so assert the stamped client version is really in the binary.
          strings package/kiro-ha.so | grep -Fq '2.19.0'
          nm -D package/kiro-ha.so | grep -Fq 'cliproxy_plugin_init'
          sha256sum package/kiro-ha.so | sed 's#package/##' > package/kiro-ha.so.sha256
          tar -C package -czf "kiro-ha-linux-${GOARCH}.tar.gz" kiro-ha.so kiro-ha.h kiro-ha.so.sha256
          sha256sum "kiro-ha-linux-${GOARCH}.tar.gz" > "kiro-ha-linux-${GOARCH}.tar.gz.sha256"
      - name: Upload release assets
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "kiro-ha-linux-${{ matrix.arch }}.tar.gz" "kiro-ha-linux-${{ matrix.arch }}.tar.gz.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  release:
    if: needs.prepare-release.outputs.tag != ''
    needs: [prepare-release, windows-amd64, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
